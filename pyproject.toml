[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "lacuna-llm"
version = "0.3.0"
description = "Lookahead sparse-paged LLM inference: 100B-class models on 8 GB RAM + <4 GB VRAM"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Lacuna contributors" }]
keywords = ["llm", "inference", "sparse", "paging", "edge", "llama.cpp"]
dependencies = ["numpy>=1.24"]

[project.scripts]
lacuna = "lacuna.cli:main"

[project.urls]
Homepage = "https://github.com/X0D4N/lacuna"

[tool.setuptools.packages.find]
include = ["lacuna*", "simulator*"]
